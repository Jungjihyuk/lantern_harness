id: cognitive-guard-per-call
description: per-call max_diff_lines 초과 시 self_correct deny
type: hook_unit
hook: pre_tool_use
setup:
  init_harness: true
  active_yaml_overrides:
    required_context:
      paths: []
    cognitive_guard:
      per_call:
        max_diff_lines: 5
  pre_calls:
    - hook: session_start
      input: { hook_type: session_start }
input:
  hook_type: pre_tool_use
  tool_name: Write
  tool_args:
    file_path: big.txt
    content: "line\nline\nline\nline\nline\nline\nline\nline"
expect:
  exit_code: 2
  stderr_contains: "큰 변경 감지"
