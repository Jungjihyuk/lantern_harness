id: required_hard_stop
description: Required Context 중 하나가 hard_stop 마킹된 경우 → 전체 턴 정지 응답
type: hook_unit
hook: pre_tool_use
setup:
  init_harness: true
  files:
  - path: README.md
    content: 'test

      '
  - path: SECURITY.md
    content: 'secrets

      '
  pre_calls:
  - hook: session_start
    input:
      hook_type: session_start
  compose_overrides:
    cognition:
      context:
        required:
        - id: req_readme
          src_path: README.md
          label: 프로젝트 정의
        - id: req_security
          src_path: SECURITY.md
          label: 보안 정책
          on_deny: hard_stop
input:
  hook_type: pre_tool_use
  tool_name: Edit
  tool_args:
    file_path: foo.py
    old_string: a
    new_string: b
expect:
  decision: hard_stop
