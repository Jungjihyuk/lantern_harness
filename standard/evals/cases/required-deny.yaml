id: required-deny
description: Required Context 미읽음 시 Edit 차단 (self_correct)
type: hook_unit
hook: pre_tool_use
setup:
  init_harness: true
  active_yaml_overrides:
    required_context:
      paths:
        - { path: README.md, label: "프로젝트 정의" }
  files:
    - { path: README.md, content: "test\n" }
  pre_calls:
    - hook: session_start
      input: { hook_type: session_start }
input:
  hook_type: pre_tool_use
  tool_name: Edit
  tool_args:
    file_path: foo.py
    old_string: a
    new_string: b
expect:
  exit_code: 2
  stderr_contains: "Required Context 미읽음"
