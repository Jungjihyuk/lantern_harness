id: required_allow_after_read
description: Required Context Read 후 Edit 통과 (allow)
type: hook_unit
hook: pre_tool_use
setup:
  init_harness: true
  files:
  - path: README.md
    content: 'test

      '
  pre_calls:
  - hook: session_start
    input:
      hook_type: session_start
  - hook: post_tool_use
    input:
      hook_type: post_tool_use
      tool_name: Read
      tool_args:
        file_path: README.md
  compose_overrides:
    cognition:
      context:
        required:
        - id: req_readme
          src_path: README.md
          label: 프로젝트 정의
input:
  hook_type: pre_tool_use
  tool_name: Edit
  tool_args:
    file_path: foo.py
    old_string: a
    new_string: b
expect:
  decision: allow
